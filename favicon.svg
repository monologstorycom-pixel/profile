<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d110d"/>
      <stop offset="100%" style="stop-color:#0a0f0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6bcf6b"/>
      <stop offset="100%" style="stop-color:#52a852"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Border accent -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#52a852" stroke-width="1.5" opacity="0.35"/>

  <!-- Corner dots -->
  <circle cx="9" cy="9" r="1.5" fill="#52a852" opacity="0.6"/>
  <circle cx="55" cy="9" r="1.5" fill="#52a852" opacity="0.6"/>
  <circle cx="9" cy="55" r="1.5" fill="#52a852" opacity="0.6"/>
  <circle cx="55" cy="55" r="1.5" fill="#52a852" opacity="0.6"/>

  <!-- Letter R -->
  <g filter="url(#glow)">
    <text x="7" y="46" 
          font-family="'IBM Plex Mono', 'Courier New', monospace" 
          font-size="34" 
          font-weight="700"
          fill="url(#accent)"
          letter-spacing="-1">RS</text>
  </g>

  <!-- Underline accent -->
  <rect x="7" y="50" width="50" height="2" rx="1" fill="#52a852" opacity="0.4"/>

  <!-- Top blink dot -->
  <circle cx="54" cy="12" r="3" fill="#52a852" opacity="0.9"/>
  <circle cx="54" cy="12" r="1.5" fill="#cce8c4"/>
</svg>
